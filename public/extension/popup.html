<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clarity Interview Assistant</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
    }

    .header {
      padding: 20px;
      text-align: center;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
    }

    .logo {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 5px;
    }

    .status-text {
      font-size: 13px;
      opacity: 0.9;
    }

    /* Auth View */
    .auth-view {
      padding: 30px 20px;
      text-align: center;
    }

    .auth-view h2 {
      font-size: 18px;
      margin-bottom: 12px;
    }

    .auth-view p {
      font-size: 14px;
      opacity: 0.9;
      margin-bottom: 20px;
      line-height: 1.5;
    }

    .auth-btn {
      width: 100%;
      padding: 14px;
      background: white;
      color: #667eea;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 10px;
    }

    .auth-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    /* Main View */
    .main-view {
      display: none;
    }

    .user-info {
      padding: 15px 20px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .user-details {
      flex: 1;
    }

    .user-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 4px;
    }

    .user-plan {
      font-size: 12px;
      opacity: 0.9;
      display: inline-block;
      padding: 3px 10px;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 12px;
    }

    .plan-pro {
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
    }

    .logout-btn {
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.2);
      border: none;
      border-radius: 8px;
      color: white;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .logout-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .usage-stats {
      padding: 20px;
      background: rgba(255, 255, 255, 0.05);
    }

    .stat-item {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    .stat-item:last-child {
      border-bottom: none;
    }

    .stat-label {
      font-size: 13px;
      opacity: 0.9;
    }

    .stat-value {
      font-size: 14px;
      font-weight: 600;
    }

    .upgrade-banner {
      margin: 15px 20px;
      padding: 15px;
      background: linear-gradient(135deg, #FFD700 0%, #FFA500 100%);
      border-radius: 12px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    .upgrade-banner:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(255, 215, 0, 0.4);
    }

    .upgrade-banner h3 {
      font-size: 15px;
      margin-bottom: 5px;
      color: #333;
    }

    .upgrade-banner p {
      font-size: 12px;
      color: #555;
    }

    .menu {
      padding: 10px;
    }

    .menu-item {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: none;
      border-radius: 10px;
      color: white;
      font-size: 14px;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-bottom: 8px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .menu-item:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: translateX(5px);
    }

    .footer {
      padding: 15px 20px;
      text-align: center;
      font-size: 12px;
      opacity: 0.8;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
    }

    .footer a {
      color: white;
      text-decoration: none;
      margin: 0 8px;
    }

    .footer a:hover {
      text-decoration: underline;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">✨ Clarity</div>
    <div class="status-text">AI Interview Assistant</div>
  </div>

  <!-- Auth View -->
  <div class="auth-view" id="auth-view">
    <h2>Welcome to Clarity</h2>
    <p>Sign in to unlock AI-powered interview assistance, smart note-taking, and performance insights.</p>
    <button class="auth-btn" id="sign-in-btn">Sign In / Sign Up</button>
  </div>

  <!-- Main View -->
  <div class="main-view" id="main-view">
    <div class="user-info">
      <div class="user-details">
        <div class="user-name" id="user-name">Loading...</div>
        <span class="user-plan" id="user-plan">Free</span>
      </div>
      <button class="logout-btn" id="logout-btn">Logout</button>
    </div>

    <div class="usage-stats" id="usage-stats">
      <div class="stat-item">
        <span class="stat-label">Interviews this month</span>
        <span class="stat-value" id="interviews-used">0 / 5</span>
      </div>
      <div class="stat-item" id="ai-answers-stat" style="display: none;">
        <span class="stat-label">AI Answers today</span>
        <span class="stat-value" id="ai-answers-used">0 / ∞</span>
      </div>
    </div>

    <div class="upgrade-banner hidden" id="upgrade-banner">
      <h3>🚀 Upgrade to Pro</h3>
      <p>Unlimited interviews + Real-time AI answers</p>
    </div>

    <div class="menu">
      <button class="menu-item" id="start-interview">
        <span>🎯</span>
        <span>Start Interview Mode</span>
      </button>
      <button class="menu-item" id="open-overlay">
        <span>💬</span>
        <span>Open Assistant</span>
      </button>
      <button class="menu-item" id="view-notes">
        <span>📝</span>
        <span>View Notes</span>
      </button>
    </div>

    <div class="footer">
      <a href="#" id="help">Help</a>
      <span>•</span>
      <a href="#" id="feedback">Feedback</a>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
